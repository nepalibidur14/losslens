<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LossLens</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --border: #e4dfd5;
    --accent: #c2410c;
    --accent-soft: #fff1e6;
    --user: #1f2937;
    --user-text: #ffffff;
    --bot: #ffffff;
    --ok: #15803d;
    --ok-soft: #e8f6ec;
    --err: #b91c1c;
    --err-soft: #fdecec;
    --code-bg: #f3f1ec;
    --chip: #f1ede4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513;
      --card: #201f1c;
      --text: #ece9e3;
      --muted: #a39d93;
      --border: #34312c;
      --accent: #fb923c;
      --accent-soft: #3a2616;
      --user: #374151;
      --user-text: #f9fafb;
      --bot: #26241f;
      --ok: #4ade80;
      --ok-soft: #173222;
      --err: #f87171;
      --err-soft: #3a1b1b;
      --code-bg: #181715;
      --chip: #2c2a25;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --card: #201f1c; --text: #ece9e3; --muted: #a39d93; --border: #34312c;
    --accent: #fb923c; --accent-soft: #3a2616; --user: #374151; --user-text: #f9fafb; --bot: #26241f;
    --ok: #4ade80; --ok-soft: #173222; --err: #f87171; --err-soft: #3a1b1b; --code-bg: #181715; --chip: #2c2a25;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
  header p { margin: 4px 0 20px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .card h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 0.8rem; margin-right: 8px;
  }
  .disabled { opacity: 0.5; pointer-events: none; }
  .drop {
    display: block; border: 2px dashed var(--border); border-radius: 12px;
    padding: 18px; text-align: center; cursor: pointer; color: var(--muted);
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop input { display: none; }
  .drop strong { color: var(--text); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 9px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 0; text-decoration: underline; }
  .status { margin-top: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .status.err { color: var(--err); }
  .ok-box { background: var(--ok-soft); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .ok-box .title { color: var(--ok); font-weight: 600; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0; color: var(--text); font-size: 0.95rem; }
  .stats b { font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .examples button { background: var(--accent-soft); border-color: transparent; font-size: 0.92rem; text-align: left; }
  .chat { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .msg { max-width: 100%; min-width: 0; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { align-self: stretch; background: var(--bot); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; padding: 12px 14px; }
  .msg.err { align-self: stretch; background: var(--err-soft); color: var(--err); border-radius: 12px; padding: 10px 14px; }
  .msg.wait { align-self: flex-start; color: var(--muted); display: flex; gap: 8px; align-items: center; padding: 6px 2px; }
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0.5em 0; }
  .md ul, .md ol { padding-left: 1.3em; margin: 0.5em 0; }
  .md table { display: block; overflow-x: auto; max-width: 100%; border-collapse: collapse; margin: 0.6em 0; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; white-space: nowrap; }
  .md th { background: var(--chip); text-align: left; }
  .md code { background: var(--code-bg); border-radius: 4px; padding: 1px 4px; font-size: 0.9em; }
  .md pre { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .md a { color: var(--accent); }
  .plain { white-space: pre-wrap; }
  .chart { display: block; max-width: 100%; height: auto; margin-top: 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge { font-size: 0.78rem; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--border); background: var(--chip); }
  details.work { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  details.work summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  .step { margin-top: 10px; }
  .step-head { font-size: 0.85rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .step-head .tool { color: var(--text); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .step-head .bad { color: var(--err); }
  .step-head .good { color: var(--ok); }
  .step pre {
    background: var(--code-bg); border-radius: 8px; padding: 10px; margin: 6px 0 0;
    overflow: auto; max-height: 320px; font-size: 0.8rem; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre;
  }
  .step pre.out { max-height: 180px; font-size: 0.75rem; color: var(--muted); }
  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .hidden { display: none !important; }
  @media (max-width: 520px) {
    header h1 { font-size: 1.6rem; }
    .card { padding: 14px; }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LossLens 🥐</h1>
    <p>POS shows what you sold. We show what you threw away.</p>
  </header>

  <section class="card" id="step1">
    <h2><span class="num">1</span>Upload your sales CSV</h2>
    <div id="uploadForm">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".csv,text/csv">
        <div><strong>Choose a CSV file</strong> or drop it here</div>
        <div id="fileName" style="margin-top:4px;font-size:.9rem;"></div>
      </label>
      <div class="row">
        <button class="primary" id="uploadBtn" disabled>Upload</button>
      </div>
    </div>
    <div class="status hidden" id="uploadStatus"></div>
    <div class="ok-box hidden" id="summary"></div>
  </section>

  <section class="card disabled" id="step2">
    <h2><span class="num">2</span>Ask LossLens</h2>
    <div class="examples" id="examples">
      <button type="button">先月はいくら捨てた?去年の同じ月と比べて?</button>
      <button type="button">雨の日に一番ロスが多い商品は?</button>
      <button type="button">明日メロンパンは何個焼くべき?</button>
    </div>
    <div class="chat" id="chat"></div>
    <form class="composer" id="composer">
      <input id="msg" type="text" autocomplete="off" placeholder="Ask in Japanese or English…" maxlength="2000">
      <button class="primary" id="sendBtn" type="submit">Send</button>
    </form>
  </section>
</div>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'losslens.shop';
  var state = { shopId: null, summary: null, history: [], busy: false };

  var $ = function (id) { return document.getElementById(id); };
  var fileInput = $('file'), drop = $('drop'), fileName = $('fileName'), uploadBtn = $('uploadBtn');
  var uploadForm = $('uploadForm'), uploadStatus = $('uploadStatus'), summaryBox = $('summary');
  var step2 = $('step2'), chat = $('chat'), composer = $('composer'), msgInput = $('msg'), sendBtn = $('sendBtn');
  var exampleBtns = Array.prototype.slice.call(document.querySelectorAll('#examples button'));

  // ---------- helpers ----------
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
  function saveShop() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ shopId: state.shopId, summary: state.summary, setupMs: state.setupMs })); } catch (e) {}
  }
  function loadShop() {
    try { var v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function clearShop() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
  async function readJson(res) {
    try { return await res.json(); } catch (e) { return {}; }
  }

  var mdReady = typeof window.marked !== 'undefined' && typeof window.DOMPurify !== 'undefined';
  if (mdReady) {
    try {
      window.DOMPurify.addHook('afterSanitizeAttributes', function (node) {
        if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
      });
    } catch (e) {}
  }
  function renderMarkdown(text) {
    var box = el('div', 'md');
    if (mdReady) {
      try {
        var html = window.marked.parse(String(text || ''), { gfm: true, breaks: false });
        box.innerHTML = window.DOMPurify.sanitize(html);
        return box;
      } catch (e) { /* fall through to plain text */ }
    }
    box.className = 'md plain';
    box.textContent = String(text || '');
    return box;
  }
  function scrollToBottom() {
    var last = chat.lastElementChild;
    if (last && last.scrollIntoView) last.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  // ---------- step 1: upload ----------
  var chosenFile = null;
  function setFile(f) {
    chosenFile = f || null;
    fileName.textContent = chosenFile ? chosenFile.name + ' (' + fmtNum(Math.round(chosenFile.size / 1024)) + ' KB)' : '';
    uploadBtn.disabled = !chosenFile;
  }
  fileInput.addEventListener('change', function () { setFile(fileInput.files && fileInput.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  function showStatus(text, kind) {
    uploadStatus.className = 'status' + (kind === 'err' ? ' err' : '');
    uploadStatus.innerHTML = '';
    if (kind === 'wait') uploadStatus.appendChild(el('span', 'spinner'));
    uploadStatus.appendChild(el('span', null, text));
  }
  function hideStatus() { uploadStatus.className = 'status hidden'; uploadStatus.innerHTML = ''; }

  function renderSummary(restored) {
    var s = state.summary || {};
    summaryBox.innerHTML = '';
    summaryBox.appendChild(el('div', 'title', "Data stored in your shop's private Daytona sandbox ✅"));
    var stats = el('div', 'stats');
    function stat(label, value) {
      var span = el('span');
      span.appendChild(document.createTextNode(label + ' '));
      span.appendChild(el('b', null, value));
      stats.appendChild(span);
    }
    stat('Rows', fmtNum(s.rows));
    stat('Dates', (s.dateFrom || '?') + ' → ' + (s.dateTo || '?'));
    stat('Days', fmtNum(s.days));
    if (typeof state.setupMs === 'number') stat('Ready in', (state.setupMs / 1000).toFixed(1) + ' s');
    summaryBox.appendChild(stats);
    var chips = el('div', 'chips');
    (s.items || []).forEach(function (it) { chips.appendChild(el('span', 'chip', it)); });
    summaryBox.appendChild(chips);
    var row = el('div', 'row');
    if (restored) row.appendChild(el('span', null, '(restored from this browser)'));
    var again = el('button', 'link', 'Upload a different CSV');
    again.type = 'button';
    again.addEventListener('click', function () { resetToUpload(''); });
    row.appendChild(again);
    summaryBox.appendChild(row);
    summaryBox.classList.remove('hidden');
  }

  function setChatEnabled(on) {
    step2.classList.toggle('disabled', !on);
    setBusy(state.busy);
  }

  function resetToUpload(message) {
    state.shopId = null; state.summary = null; state.history = []; state.setupMs = undefined;
    clearShop();
    summaryBox.classList.add('hidden');
    uploadForm.classList.remove('hidden');
    setFile(null);
    fileInput.value = '';
    chat.innerHTML = '';
    setChatEnabled(false);
    if (message) showStatus(message, 'err'); else hideStatus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  uploadBtn.addEventListener('click', async function () {
    if (!chosenFile) return;
    uploadBtn.disabled = true;
    showStatus('Creating your private Daytona sandbox…', 'wait');
    var t0 = performance.now();
    try {
      var fd = new FormData();
      fd.append('file', chosenFile);
      var res = await fetch('/api/upload', { method: 'POST', body: fd });
      var data = await readJson(res);
      if (!res.ok || !data.shopId) {
        showStatus(data.error || 'Upload failed. Please try again.', 'err');
        uploadBtn.disabled = false;
        return;
      }
      state.shopId = data.shopId;
      state.summary = data.summary || {};
      state.setupMs = typeof data.setupMs === 'number' ? data.setupMs : Math.round(performance.now() - t0);
      state.history = [];
      saveShop();
      hideStatus();
      uploadForm.classList.add('hidden');
      renderSummary(false);
      chat.innerHTML = '';
      setChatEnabled(true);
      msgInput.focus();
    } catch (e) {
      showStatus('Network error, please try again.', 'err');
      uploadBtn.disabled = false;
    }
  });

  // ---------- step 2: chat ----------
  function setBusy(b) {
    state.busy = b;
    var off = b || !state.shopId;
    msgInput.disabled = off;
    sendBtn.disabled = off;
    exampleBtns.forEach(function (btn) { btn.disabled = off; });
  }

  function addUser(text) { chat.appendChild(el('div', 'msg user', text)); scrollToBottom(); }
  function addError(text) { chat.appendChild(el('div', 'msg err', text)); scrollToBottom(); }
  function addWaiting() {
    var w = el('div', 'msg wait');
    w.appendChild(el('span', 'spinner'));
    w.appendChild(el('span', null, 'LossLens is analysing in the sandbox…'));
    chat.appendChild(w);
    scrollToBottom();
    return w;
  }

  var TOOL_LABEL = { run_python: 'Daytona', get_tomorrow_context: 'Tavily' };

  function renderSteps(steps) {
    var d = el('details', 'work');
    var nDay = steps.filter(function (s) { return s.tool === 'run_python'; }).length;
    var nTav = steps.filter(function (s) { return s.tool === 'get_tomorrow_context'; }).length;
    var parts = [];
    if (nDay) parts.push(nDay + ' in Daytona');
    if (nTav) parts.push(nTav + ' via Tavily');
    var label = 'Show the work (' + steps.length + ' step' + (steps.length === 1 ? '' : 's') +
      (parts.length ? ': ' + parts.join(', ') : '') + ')';
    d.appendChild(el('summary', null, label));
    steps.forEach(function (s, i) {
      var box = el('div', 'step');
      var head = el('div', 'step-head');
      head.appendChild(el('span', null, (i + 1) + '.'));
      head.appendChild(el('span', 'tool', s.tool || 'tool'));
      if (TOOL_LABEL[s.tool]) head.appendChild(el('span', null, '· ' + TOOL_LABEL[s.tool]));
      head.appendChild(el('span', s.ok ? 'good' : 'bad', s.ok ? '✓ ok' : '✗ error (Claude retried)'));
      if (typeof s.ms === 'number') head.appendChild(el('span', null, fmtNum(s.ms) + ' ms'));
      box.appendChild(head);
      var pre = el('pre');
      pre.appendChild(el('code', null, s.input || ''));
      box.appendChild(pre);
      if (s.output) box.appendChild(el('pre', 'out', s.output));
      d.appendChild(box);
    });
    return d;
  }

  function addAnswer(data) {
    var m = el('div', 'msg bot');
    m.appendChild(renderMarkdown(data.answer || ''));
    if (typeof data.chartBase64 === 'string' && /^[A-Za-z0-9+/=\s]+$/.test(data.chartBase64)) {
      var img = el('img', 'chart');
      img.alt = 'Chart from the Daytona sandbox';
      img.src = 'data:image/png;base64,' + data.chartBase64.replace(/\s/g, '');
      m.appendChild(img);
    }
    var tools = Array.isArray(data.toolsUsed) ? data.toolsUsed : [];
    if (tools.length) {
      var b = el('div', 'badges');
      if (tools.indexOf('daytona') !== -1) b.appendChild(el('span', 'badge', '🧪 Daytona sandbox'));
      if (tools.indexOf('tavily') !== -1) b.appendChild(el('span', 'badge', '🌐 Tavily web'));
      m.appendChild(b);
    }
    if (Array.isArray(data.steps) && data.steps.length) m.appendChild(renderSteps(data.steps));
    chat.appendChild(m);
    scrollToBottom();
  }

  async function send(text) {
    text = String(text || '').trim();
    if (!text || state.busy || !state.shopId) return;
    setBusy(true);
    addUser(text);
    msgInput.value = '';
    var waiting = addWaiting();
    var history = state.history.slice(-10);
    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shopId: state.shopId, message: text, history: history })
      });
      var data = await readJson(res);
      waiting.remove();
      if (res.status === 404) {
        resetToUpload('Your sandbox was reset. Please upload the CSV again.');
        return;
      }
      if (!res.ok) {
        addError(data.error || 'Something went wrong. Please try again.');
        return;
      }
      addAnswer(data);
      state.history.push({ role: 'user', content: text });
      state.history.push({ role: 'assistant', content: String(data.answer || '') });
      if (state.history.length > 20) state.history = state.history.slice(-20);
    } catch (e) {
      if (waiting.parentNode) waiting.remove();
      addError('Network error, please try again.');
    } finally {
      setBusy(false);
      if (state.shopId) msgInput.focus();
    }
  }

  composer.addEventListener('submit', function (e) { e.preventDefault(); send(msgInput.value); });
  exampleBtns.forEach(function (btn) {
    btn.addEventListener('click', function () { send(btn.textContent); });
  });

  // ---------- restore after refresh ----------
  var saved = loadShop();
  if (saved && saved.shopId) {
    state.shopId = saved.shopId;
    state.summary = saved.summary || {};
    state.setupMs = saved.setupMs;
    uploadForm.classList.add('hidden');
    renderSummary(true);
    setChatEnabled(true);
  } else {
    setChatEnabled(false);
  }
})();
</script>
</body>
</html>
