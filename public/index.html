<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LossLens</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #FFF8EE;
    --card: rgba(255, 255, 255, 0.93);
    --card-solid: #ffffff;
    --text: #3B2A1E;
    --muted: #7A6553;
    --border: #F0E3D2;
    --accent: #D9822B;          /* decoration: borders, spinner */
    --accent-strong: #A9581A;   /* buttons + links (AA contrast on white) */
    --accent-hover: #8E4813;
    --accent-soft: #FFF1E0;
    --chip-text: #6B3E14;
    --user: #FFE9D2;
    --ok: #276B43;
    --ok-soft: #E8F6EC;
    --err: #A61B1B;
    --err-soft: #FDECEC;
    --code-bg: #FBF6EF;
    --th: #FFF4E5;
    --zebra: #FFFBF5;
    --shadow: 0 4px 18px rgba(120, 80, 40, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }
  /* Decorative bakery pattern behind everything */
  #bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.12; background-repeat: repeat; background-size: 260px 260px;
  }
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 28px 16px 24px; }
  /* Item 19: two columns on desktop (upload left, chat right), stacked on mobile */
  .layout { display: block; }
  @media (min-width: 900px) {
    .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; align-items: start; }
    #step1 {
      position: sticky; top: 16px; margin-bottom: 0;
      max-height: calc(100vh - 32px); overflow-y: auto;
    }
    .chat-panel {
      margin-bottom: 0;
      height: calc(100vh - var(--panel-top, 150px) - 20px);
      height: calc(100dvh - var(--panel-top, 150px) - 20px);
      min-height: 480px;
    }
  }
  .lang {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    background: var(--card-solid); color: var(--accent-strong);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; font-weight: 700; box-shadow: var(--shadow);
  }
  .lang:hover { background: var(--accent-soft); }
  header { padding-right: 110px; }
  header h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.02em; }
  header p { margin: 4px 0 22px; color: var(--muted); font-size: 1.02rem; }
  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 14px; font-size: 1.12rem; display: flex; align-items: center; }
  .card h2 .num {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-strong); color: #fff; font-size: 0.9rem; margin-right: 10px;
  }
  .disabled { opacity: 0.55; pointer-events: none; }
  .drop {
    display: block; border: 2px dashed #E8CFAE; border-radius: 14px; background: #FFFBF5;
    padding: 22px 16px; text-align: center; cursor: pointer; color: var(--muted);
    transition: border-color .15s, background .15s;
  }
  .drop:hover { border-color: var(--accent); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop input { display: none; }
  .drop strong { color: var(--accent-strong); }
  .drop .icon { font-size: 1.8rem; line-height: 1; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card-solid); color: var(--text);
    border-radius: 12px; padding: 10px 16px; cursor: pointer;
  }
  button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: 700; padding: 11px 22px; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.link { border: none; background: none; color: var(--accent-strong); padding: 4px 0; text-decoration: underline; }
  .status { margin-top: 14px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .status.err { color: var(--err); }
  .ok-box { background: var(--ok-soft); border-radius: 12px; padding: 14px 16px; margin-top: 4px; }
  .ok-box .title { color: var(--ok); font-weight: 700; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0; font-size: 0.95rem; }
  .stats b { font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--card-solid); border: 1px solid #D5EBDC; border-radius: 999px; padding: 2px 11px; font-size: 0.85rem; }
  /* Item 18: chat panel = scrolling messages + dock (chips + input) pinned at the bottom */
  .chat-panel { display: flex; flex-direction: column; }
  .chat-panel > h2 { flex: none; }
  .chat {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 14px;
    padding: 2px 8px 8px 2px; margin-right: -6px;
    scrollbar-width: thin; scrollbar-color: #E2C29D transparent;
  }
  .chat > * { flex: none; }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: #E2C29D; border-radius: 999px; }
  .chat::-webkit-scrollbar-thumb:hover { background: #D9A86F; }
  .chat:empty::before {
    content: attr(data-empty); margin: auto; padding: 24px 12px;
    color: var(--muted); text-align: center; font-size: 0.95rem;
  }
  .dock { flex: none; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 6px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .examples button {
    background: var(--accent-soft); border: 1px solid #F3D9B8; color: var(--chip-text);
    border-radius: 999px; padding: 8px 14px; font-size: 0.9rem; text-align: left;
  }
  .examples button:hover:not(:disabled) { background: #FFE4C4; }
  @media (max-width: 899px) {
    .chat { max-height: 65vh; min-height: 140px; }
  }
  .msg { max-width: 100%; min-width: 0; }
  .msg.user {
    align-self: flex-end; background: var(--user); color: var(--text);
    border-radius: 16px 16px 4px 16px; padding: 10px 15px; max-width: 85%;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.bot {
    align-self: stretch; background: var(--card-solid); border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(120, 80, 40, 0.05);
  }
  .msg.err { align-self: stretch; background: var(--err-soft); color: var(--err); border-radius: 12px; padding: 11px 15px; }
  .msg.wait { align-self: flex-start; color: var(--muted); display: flex; gap: 10px; align-items: center; padding: 6px 2px; }
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0.5em 0; }
  .md ul, .md ol { padding-left: 1.3em; margin: 0.5em 0; }
  .md table {
    display: block; overflow-x: auto; max-width: 100%; border-collapse: collapse;
    margin: 0.7em 0; font-size: 0.93rem; font-variant-numeric: tabular-nums;
  }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; white-space: nowrap; }
  .md th { background: var(--th); text-align: left; font-weight: 700; }
  .md tbody tr:nth-child(even) td { background: var(--zebra); }
  .md code { background: var(--code-bg); border-radius: 4px; padding: 1px 4px; font-size: 0.9em; }
  .md pre { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .md a { color: var(--accent-strong); }
  .plain { white-space: pre-wrap; }
  .chart { display: block; max-width: 100%; height: auto; margin-top: 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .badge { font-size: 0.8rem; border-radius: 999px; padding: 3px 11px; border: 1px solid var(--border); background: var(--zebra); color: var(--chip-text); }
  details.work { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 8px; }
  details.work summary { cursor: pointer; color: var(--muted); font-size: 0.92rem; }
  .step { margin-top: 10px; }
  .step-head { font-size: 0.86rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .step-head .tool { color: var(--text); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .step-head .bad { color: var(--err); }
  .step-head .good { color: var(--ok); }
  .step pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 6px 0 0;
    overflow: auto; max-height: 320px; font-size: 0.8rem; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre;
  }
  .step pre.out { max-height: 180px; font-size: 0.75rem; color: var(--muted); }
  .composer { display: flex; gap: 10px; }
  .composer input {
    flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px;
    border: 1px solid #E8CFAE; background: var(--card-solid); color: var(--text);
  }
  .composer input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .backtest { margin-top: 14px; padding: 12px 14px; background: var(--card-solid); border: 1px solid #D5EBDC; border-radius: 12px; }
  .backtest .bt-wait { color: var(--muted); display: flex; align-items: center; gap: 10px; font-size: 0.93rem; }
  .backtest .bt-head { font-weight: 700; }
  .backtest .bt-sub { color: var(--muted); font-size: 0.9rem; margin-top: 3px; }
  .backtest details { margin-top: 8px; }
  .backtest summary { cursor: pointer; color: var(--muted); font-size: 0.92rem; }
  .bt-scroll { overflow-x: auto; max-width: 100%; margin-top: 6px; }
  .bt-table { border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
  .bt-table th, .bt-table td { border: 1px solid var(--border); padding: 5px 9px; white-space: nowrap; text-align: right; }
  .bt-table th:first-child, .bt-table td:first-child { text-align: left; }
  .bt-table th { background: var(--th); }
  .bt-table tbody tr:nth-child(even) td { background: var(--zebra); }
  .bt-method { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
  .hidden { display: none !important; }
  @media (max-width: 520px) {
    header { padding-right: 96px; }
    header h1 { font-size: 1.7rem; }
    header p { font-size: 0.95rem; }
    .lang { top: 10px; right: 10px; padding: 7px 13px; }
    .card { padding: 16px; }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<button type="button" class="lang" id="langBtn" aria-label="Switch language">日本語</button>

<div class="wrap">
  <header>
    <h1>LossLens 🥐</h1>
    <p data-i18n="subtitle">POS shows what you sold. We show what you threw away.</p>
  </header>

  <div class="layout">
  <section class="card" id="step1">
    <h2><span class="num">1</span><span data-i18n="step1Title">Upload your sales CSV</span></h2>
    <div id="uploadForm">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".csv,text/csv">
        <div class="icon" aria-hidden="true">📄</div>
        <div><strong data-i18n="dropMain">Choose a CSV file</strong> <span data-i18n="dropRest">or drop it here</span></div>
        <div id="fileName" style="margin-top:4px;font-size:.9rem;"></div>
      </label>
      <div class="row">
        <button class="primary" id="uploadBtn" disabled data-i18n="uploadBtn">Upload</button>
      </div>
    </div>
    <div class="status hidden" id="uploadStatus"></div>
    <div class="ok-box hidden" id="summary"></div>
  </section>

  <section class="card chat-panel disabled" id="step2">
    <h2><span class="num">2</span><span data-i18n="step2Title">Ask LossLens</span></h2>
    <div class="chat" id="chat" data-empty="Your answers will appear here. Try one of the questions below."></div>
    <div class="dock">
      <div class="examples" id="examples"></div>
      <form class="composer" id="composer">
        <input id="msg" type="text" autocomplete="off" maxlength="2000" placeholder="Ask anything about your sales or waste…">
        <button class="primary" id="sendBtn" type="submit" data-i18n="send">Send</button>
      </form>
    </div>
  </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- i18n (items 14 + 17) ----------
  var I18N = {
    en: {
      toggle: '日本語',
      subtitle: 'POS shows what you sold. We show what you threw away.',
      step1Title: 'Upload your sales CSV',
      dropMain: 'Choose a CSV file',
      dropRest: 'or drop it here',
      uploadBtn: 'Upload',
      uploading: 'Setting up your private sandbox…',
      uploadFailed: 'Upload failed. Please try again.',
      network: 'Network error. Please try again.',
      stored: "Your data is safely stored in your shop's private Daytona sandbox ✅",
      rows: 'Rows', dates: 'Dates', days: 'Days', ready: 'Ready in',
      restored: '(restored from this browser)',
      uploadAgain: 'Upload a different CSV',
      step2Title: 'Ask LossLens',
      examples: [
        'How much did we waste last month vs the same month last year?',
        'Which item loses the most on rainy days?',
        'How many melon pans should we bake tomorrow?'
      ],
      placeholder: 'Ask anything about your sales or waste…',
      chatEmpty: 'Your answers will appear here. Try one of the questions below.',
      send: 'Send',
      thinking: 'Looking at your numbers…',
      reset: 'Your sandbox was reset. Please upload the CSV again.',
      genericErr: 'Something went wrong. Please try again.',
      btWait: 'Checking how much you could have saved in the last 30 days…',
      btHeadPos: 'If you had followed LossLens for the last {days} days ({from} → {to}), you would have saved about {net}',
      btHeadNeg: 'If you had followed LossLens for the last {days} days ({from} → {to}), your waste cost would have changed by {signed}',
      btSub: 'Less waste {wasteSaved} · missed sales {lostSales} · same fixed calculation every time',
      perItem: 'Per item',
      thItem: 'Item', thBefore: 'Waste (actual)', thAfter: 'Waste (with LossLens)', thLost: 'Missed sales', thNet: 'Net saving',
      btMethod: "How we calculate: for each day we bake the top of LossLens's suggested range, using only earlier data and that day's weather. Waste = made − sold. Missed sales = profit on items that would have sold out.",
      workOne: 'Show the work (1 step)',
      workMany: 'Show the work ({n} steps)',
      stepOk: '✓ done', stepErr: '✗ error (retried)',
      badgeDaytona: '🧪 Daytona sandbox', badgeTavily: '🌐 Tavily web',
      chartAlt: 'Chart made in the Daytona sandbox'
    },
    ja: {
      toggle: 'English',
      subtitle: 'POSは売れたものを見せる。LossLensは捨てたものを見せる。',
      step1Title: '売上CSVをアップロード',
      dropMain: 'CSVファイルを選ぶ',
      dropRest: 'またはここにドロップ',
      uploadBtn: 'アップロード',
      uploading: '専用サンドボックスを準備しています…',
      uploadFailed: 'アップロードに失敗しました。もう一度お試しください。',
      network: '通信エラーです。もう一度お試しください。',
      stored: 'データはお店専用のDaytonaサンドボックスに安全に保存されました ✅',
      rows: '行数', dates: '期間', days: '日数', ready: '準備時間',
      restored: '(このブラウザから復元)',
      uploadAgain: '別のCSVをアップロード',
      step2Title: 'LossLensに質問する',
      examples: [
        '先月はいくら捨てた?去年の同じ月と比べて?',
        '雨の日に一番ロスが多い商品は?',
        '明日メロンパンは何個焼くべき?'
      ],
      placeholder: '売上やロスについて何でも聞いてください…',
      chatEmpty: 'ここに回答が表示されます。下の質問を試してみてください。',
      send: '送信',
      thinking: 'データを確認しています…',
      reset: 'サンドボックスがリセットされました。CSVをもう一度アップロードしてください。',
      genericErr: 'エラーが発生しました。もう一度お試しください。',
      btWait: '過去30日でいくら節約できたかを計算しています…',
      btHeadPos: '過去{days}日間({from} → {to})LossLensの提案どおりに作っていたら、約{net}の節約になっていました',
      btHeadNeg: '過去{days}日間({from} → {to})LossLensの提案どおりに作っていたら、ロス額は{signed}変わっていました',
      btSub: 'ロス削減 {wasteSaved} · 売り逃し {lostSales} · 毎回同じ固定の計算',
      perItem: '商品別',
      thItem: '商品', thBefore: '実際のロス', thAfter: 'LossLens使用時のロス', thLost: '売り逃し', thNet: '純節約額',
      btMethod: '計算方法:各日について、それより前のデータとその日の天気だけを使い、LossLensの提案範囲の上限だけ作ったと仮定します。ロス=作った数−売れた数。売り逃し=売り切れで逃した利益。',
      workOne: '計算の中身を見る(1 ステップ)',
      workMany: '計算の中身を見る({n} ステップ)',
      stepOk: '✓ 完了', stepErr: '✗ エラー(再試行)',
      badgeDaytona: '🧪 Daytonaサンドボックス', badgeTavily: '🌐 Tavily ウェブ検索',
      chartAlt: 'Daytonaサンドボックスで作ったグラフ'
    }
  };
  var LANG_KEY = 'losslens.lang';
  var lang = 'en';
  try { var savedLang = localStorage.getItem(LANG_KEY); if (savedLang === 'ja' || savedLang === 'en') lang = savedLang; } catch (e) {}
  function t(key, vars) {
    var s = (I18N[lang] && I18N[lang][key] != null) ? I18N[lang][key] : I18N.en[key];
    if (typeof s === 'string' && vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? String(vars[k]) : m; });
    }
    return s;
  }

  var STORE_KEY = 'losslens.shop';
  var state = { shopId: null, summary: null, history: [], busy: false, restored: false, bt: null, status: null };

  var $ = function (id) { return document.getElementById(id); };
  var fileInput = $('file'), drop = $('drop'), fileName = $('fileName'), uploadBtn = $('uploadBtn');
  var uploadForm = $('uploadForm'), uploadStatus = $('uploadStatus'), summaryBox = $('summary');
  var step2 = $('step2'), chat = $('chat'), composer = $('composer'), msgInput = $('msg'), sendBtn = $('sendBtn');
  var examplesBox = $('examples'), langBtn = $('langBtn');
  var exampleBtns = [];

  // ---------- background pattern (item 15) ----------
  (function drawBackground() {
    var items = [
      ['🥐', 20, 52, -12], ['🍞', 150, 42, 10], ['🥖', 85, 112, -6], ['🥯', 200, 124, 14],
      ['🧁', 25, 178, 8], ['🍩', 130, 192, -14], ['🥪', 205, 238, 6], ['🎂', 70, 248, -8]
    ];
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'>" +
      "<g font-size='34' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif'>";
    items.forEach(function (it) {
      svg += "<text x='" + it[1] + "' y='" + it[2] + "' transform='rotate(" + it[3] + " " + (it[1] + 17) + " " + (it[2] - 12) + ")'>" + it[0] + "</text>";
    });
    svg += '</g></svg>';
    try { $('bg').style.backgroundImage = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")'; } catch (e) {}
  })();

  // ---------- helpers ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
  function yen(n) { return '¥' + Math.round(Math.abs(Number(n) || 0)).toLocaleString('ja-JP'); }
  function signedYen(n) { n = Number(n) || 0; return (n < 0 ? '−' : '+') + yen(n); }
  function saveShop() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ shopId: state.shopId, summary: state.summary, setupMs: state.setupMs })); } catch (e) {}
  }
  function loadShop() {
    try { var v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function clearShop() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
  async function readJson(res) {
    try { return await res.json(); } catch (e) { return {}; }
  }

  var mdReady = typeof window.marked !== 'undefined' && typeof window.DOMPurify !== 'undefined';
  if (mdReady) {
    try {
      window.DOMPurify.addHook('afterSanitizeAttributes', function (node) {
        if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
      });
    } catch (e) {}
  }
  function renderMarkdown(text) {
    var box = el('div', 'md');
    if (mdReady) {
      try {
        var html = window.marked.parse(String(text || ''), { gfm: true, breaks: false });
        box.innerHTML = window.DOMPurify.sanitize(html);
        return box;
      } catch (e) { /* fall through to plain text */ }
    }
    box.className = 'md plain';
    box.textContent = String(text || '');
    return box;
  }
  // Item 18: scroll the messages area (not the page) to the newest message.
  function scrollToBottom() {
    try { chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }); } catch (e) { chat.scrollTop = chat.scrollHeight; }
  }
  function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 160; }

  // Item 19: on desktop the chat panel fills the viewport below the header.
  function sizePanel() {
    try {
      var top = step2.getBoundingClientRect().top + window.scrollY;
      document.documentElement.style.setProperty('--panel-top', Math.round(top) + 'px');
    } catch (e) {}
  }
  window.addEventListener('resize', sizePanel);

  // ---------- language ----------
  function renderExamples() {
    examplesBox.innerHTML = '';
    exampleBtns = (t('examples') || []).map(function (q) {
      var b = el('button', null, q);
      b.type = 'button';
      b.addEventListener('click', function () { send(q); });
      examplesBox.appendChild(b);
      return b;
    });
    setBusy(state.busy);
  }

  function applyLang() {
    document.documentElement.lang = lang;
    langBtn.textContent = t('toggle');
    langBtn.setAttribute('aria-label', lang === 'en' ? '日本語に切り替える' : 'Switch to English');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (node) {
      node.textContent = t(node.getAttribute('data-i18n'));
    });
    msgInput.placeholder = t('placeholder');
    chat.setAttribute('data-empty', t('chatEmpty'));
    renderExamples();
    if (state.shopId && !summaryBox.classList.contains('hidden')) renderSummary();
    if (state.status && state.status.key) showStatus(state.status.key, state.status.kind);
    sizePanel();
  }

  langBtn.addEventListener('click', function () {
    lang = lang === 'en' ? 'ja' : 'en';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  });

  // ---------- step 1: upload ----------
  var chosenFile = null;
  function setFile(f) {
    chosenFile = f || null;
    fileName.textContent = chosenFile ? chosenFile.name + ' (' + fmtNum(Math.round(chosenFile.size / 1024)) + ' KB)' : '';
    uploadBtn.disabled = !chosenFile;
  }
  fileInput.addEventListener('change', function () { setFile(fileInput.files && fileInput.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  // key = i18n key (re-translated on language switch); raw = server text shown as-is
  function showStatus(key, kind, raw) {
    state.status = raw ? null : { key: key, kind: kind };
    uploadStatus.className = 'status' + (kind === 'err' ? ' err' : '');
    uploadStatus.innerHTML = '';
    if (kind === 'wait') uploadStatus.appendChild(el('span', 'spinner'));
    uploadStatus.appendChild(el('span', null, raw ? key : t(key)));
  }
  function hideStatus() { state.status = null; uploadStatus.className = 'status hidden'; uploadStatus.innerHTML = ''; }

  function renderSummary() {
    var s = state.summary || {};
    summaryBox.innerHTML = '';
    summaryBox.appendChild(el('div', 'title', t('stored')));
    var stats = el('div', 'stats');
    function stat(label, value) {
      var span = el('span');
      span.appendChild(document.createTextNode(label + ' '));
      span.appendChild(el('b', null, value));
      stats.appendChild(span);
    }
    stat(t('rows'), fmtNum(s.rows));
    stat(t('dates'), (s.dateFrom || '?') + ' → ' + (s.dateTo || '?'));
    stat(t('days'), fmtNum(s.days));
    if (typeof state.setupMs === 'number') stat(t('ready'), (state.setupMs / 1000).toFixed(1) + ' s');
    summaryBox.appendChild(stats);
    var chips = el('div', 'chips');
    (s.items || []).forEach(function (it) { chips.appendChild(el('span', 'chip', it)); });
    summaryBox.appendChild(chips);
    var row = el('div', 'row');
    if (state.restored) row.appendChild(el('span', null, t('restored')));
    var again = el('button', 'link', t('uploadAgain'));
    again.type = 'button';
    again.addEventListener('click', function () { resetToUpload(''); });
    row.appendChild(again);
    summaryBox.appendChild(row);
    summaryBox.classList.remove('hidden');
    drawBacktest();
  }

  function setChatEnabled(on) {
    step2.classList.toggle('disabled', !on);
    setBusy(state.busy);
  }

  function resetToUpload(messageKey) {
    state.shopId = null; state.summary = null; state.history = []; state.setupMs = undefined;
    state.restored = false; state.bt = null;
    clearShop();
    summaryBox.classList.add('hidden');
    summaryBox.innerHTML = '';
    uploadForm.classList.remove('hidden');
    setFile(null);
    fileInput.value = '';
    chat.innerHTML = '';
    setChatEnabled(false);
    if (messageKey) showStatus(messageKey, 'err'); else hideStatus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  uploadBtn.addEventListener('click', async function () {
    if (!chosenFile) return;
    uploadBtn.disabled = true;
    showStatus('uploading', 'wait');
    var t0 = performance.now();
    try {
      var fd = new FormData();
      fd.append('file', chosenFile);
      var res = await fetch('/api/upload', { method: 'POST', body: fd });
      var data = await readJson(res);
      if (!res.ok || !data.shopId) {
        if (data.error) showStatus(data.error, 'err', true); else showStatus('uploadFailed', 'err');
        uploadBtn.disabled = false;
        return;
      }
      state.shopId = data.shopId;
      state.summary = data.summary || {};
      state.setupMs = typeof data.setupMs === 'number' ? data.setupMs : Math.round(performance.now() - t0);
      state.history = [];
      state.restored = false;
      saveShop();
      hideStatus();
      uploadForm.classList.add('hidden');
      chat.innerHTML = '';
      renderSummary();
      setChatEnabled(true);
      msgInput.focus();
      runBacktest(state.shopId);
    } catch (e) {
      showStatus('network', 'err');
      uploadBtn.disabled = false;
    }
  });

  // ---------- backtest (item 9) ----------
  // state.bt = { shopId, status: 'pending' | 'ok' | 'fail', data }
  function drawBacktest() {
    var old = summaryBox.querySelector('.backtest');
    if (old) old.parentNode.removeChild(old);
    var bt = state.bt;
    if (!bt || bt.shopId !== state.shopId || bt.status === 'fail') return;
    var box = el('div', 'backtest');
    if (bt.status === 'pending') {
      var wait = el('div', 'bt-wait');
      wait.appendChild(el('span', 'spinner'));
      wait.appendChild(el('span', null, t('btWait')));
      box.appendChild(wait);
      summaryBox.appendChild(box);
      return;
    }
    var d = bt.data;
    var vars = {
      days: d.days, from: d.from || '?', to: d.to || '?',
      net: yen(d.netSaving), signed: signedYen(d.netSaving),
      wasteSaved: yen(d.wasteSaved), lostSales: yen(d.lostSales)
    };
    box.appendChild(el('div', 'bt-head', '📉 ' + t(d.netSaving > 0 ? 'btHeadPos' : 'btHeadNeg', vars)));
    box.appendChild(el('div', 'bt-sub', t('btSub', vars)));
    var det = el('details');
    det.appendChild(el('summary', null, t('perItem')));
    var scroll = el('div', 'bt-scroll');
    var table = el('table', 'bt-table');
    var thead = el('thead'), hr = el('tr');
    ['thItem', 'thBefore', 'thAfter', 'thLost', 'thNet'].forEach(function (k) { hr.appendChild(el('th', null, t(k))); });
    thead.appendChild(hr); table.appendChild(thead);
    var tbody = el('tbody');
    (Array.isArray(d.perItem) ? d.perItem : []).forEach(function (r) {
      var tr = el('tr');
      tr.appendChild(el('td', null, String((lang === 'en' ? (r.en || r.item) : (r.item || r.en)) || '')));
      tr.appendChild(el('td', null, yen(r.actualWasteCost)));
      tr.appendChild(el('td', null, yen(r.simWasteCost)));
      tr.appendChild(el('td', null, yen(r.lostSales)));
      tr.appendChild(el('td', null, (Number(r.netSaving) < 0 ? '−' : '') + yen(r.netSaving)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); scroll.appendChild(table); det.appendChild(scroll);
    det.appendChild(el('div', 'bt-method', t('btMethod')));
    box.appendChild(det);
    summaryBox.appendChild(box);
  }

  async function runBacktest(shopId) {
    if (!shopId) return;
    state.bt = { shopId: shopId, status: 'pending' };
    drawBacktest();
    var result = { shopId: shopId, status: 'fail' };
    try {
      var res = await fetch('/api/backtest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shopId: shopId })
      });
      var ctype = res.headers.get('content-type') || '';
      if (res.ok && ctype.indexOf('application/json') !== -1) {
        var d = await res.json();
        if (d && typeof d.netSaving === 'number' && typeof d.days === 'number') result = { shopId: shopId, status: 'ok', data: d };
      }
    } catch (e) { /* silent: hide the card */ }
    if (state.bt && state.bt.shopId === shopId) {
      state.bt = result;
      if (state.shopId === shopId) drawBacktest();
    }
  }

  // ---------- step 2: chat ----------
  function setBusy(b) {
    state.busy = b;
    var off = b || !state.shopId;
    msgInput.disabled = off;
    sendBtn.disabled = off;
    exampleBtns.forEach(function (btn) { btn.disabled = off; });
  }

  function addUser(text) { chat.appendChild(el('div', 'msg user', text)); scrollToBottom(); }
  function addError(text) { chat.appendChild(el('div', 'msg err', text)); scrollToBottom(); }
  function addWaiting() {
    var w = el('div', 'msg wait');
    w.appendChild(el('span', 'spinner'));
    w.appendChild(el('span', null, t('thinking')));
    chat.appendChild(w);
    scrollToBottom();
    return w;
  }

  var TOOL_LABEL = { run_python: 'Daytona', get_tomorrow_context: 'Tavily' };

  function renderSteps(steps) {
    var d = el('details', 'work');
    var label = steps.length === 1 ? t('workOne') : t('workMany', { n: steps.length });
    d.appendChild(el('summary', null, label));
    steps.forEach(function (s, i) {
      var box = el('div', 'step');
      var head = el('div', 'step-head');
      head.appendChild(el('span', null, (i + 1) + '.'));
      head.appendChild(el('span', 'tool', s.tool || 'tool'));
      if (TOOL_LABEL[s.tool]) head.appendChild(el('span', null, '· ' + TOOL_LABEL[s.tool]));
      head.appendChild(el('span', s.ok ? 'good' : 'bad', s.ok ? t('stepOk') : t('stepErr')));
      if (typeof s.ms === 'number') head.appendChild(el('span', null, fmtNum(s.ms) + ' ms'));
      box.appendChild(head);
      var pre = el('pre');
      pre.appendChild(el('code', null, s.input || ''));
      box.appendChild(pre);
      if (s.output) box.appendChild(el('pre', 'out', s.output));
      d.appendChild(box);
    });
    return d;
  }

  function addAnswer(data) {
    var m = el('div', 'msg bot');
    m.appendChild(renderMarkdown(data.answer || ''));
    if (typeof data.chartBase64 === 'string' && /^[A-Za-z0-9+/=\s]+$/.test(data.chartBase64)) {
      var img = el('img', 'chart');
      img.alt = t('chartAlt');
      img.src = 'data:image/png;base64,' + data.chartBase64.replace(/\s/g, '');
      img.addEventListener('load', function () { if (nearBottom()) scrollToBottom(); });
      m.appendChild(img);
    }
    var tools = Array.isArray(data.toolsUsed) ? data.toolsUsed : [];
    if (tools.length) {
      var b = el('div', 'badges');
      if (tools.indexOf('daytona') !== -1) b.appendChild(el('span', 'badge', t('badgeDaytona')));
      if (tools.indexOf('tavily') !== -1) b.appendChild(el('span', 'badge', t('badgeTavily')));
      m.appendChild(b);
    }
    if (Array.isArray(data.steps) && data.steps.length) m.appendChild(renderSteps(data.steps));
    chat.appendChild(m);
    scrollToBottom();
  }

  async function send(text) {
    text = String(text || '').trim();
    if (!text || state.busy || !state.shopId) return;
    setBusy(true);
    addUser(text);
    msgInput.value = '';
    var waiting = addWaiting();
    var history = state.history.slice(-10);
    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shopId: state.shopId, message: text, history: history })
      });
      var data = await readJson(res);
      if (waiting.parentNode) waiting.remove();
      if (res.status === 404) {
        resetToUpload('reset');
        return;
      }
      if (!res.ok) {
        addError(data.error || t('genericErr'));
        return;
      }
      addAnswer(data);
      state.history.push({ role: 'user', content: text });
      state.history.push({ role: 'assistant', content: String(data.answer || '') });
      if (state.history.length > 20) state.history = state.history.slice(-20);
    } catch (e) {
      if (waiting.parentNode) waiting.remove();
      addError(t('network'));
    } finally {
      setBusy(false);
      if (state.shopId) msgInput.focus();
    }
  }

  composer.addEventListener('submit', function (e) { e.preventDefault(); send(msgInput.value); });

  // ---------- start ----------
  applyLang();
  window.addEventListener('load', sizePanel);
  var saved = loadShop();
  if (saved && saved.shopId) {
    state.shopId = saved.shopId;
    state.summary = saved.summary || {};
    state.setupMs = saved.setupMs;
    state.restored = true;
    uploadForm.classList.add('hidden');
    renderSummary();
    setChatEnabled(true);
    runBacktest(state.shopId);
  } else {
    setChatEnabled(false);
  }
})();
</script>
</body>
</html>
